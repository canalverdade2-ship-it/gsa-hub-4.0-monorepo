name: Build and deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:all
      - run: pnpm test:all
      - run: pnpm lint:all
      - run: pnpm audit:all
      - name: Prepare validated release bundle
        run: |
          mkdir -p release-bundle/public-site release-bundle/admin-supabase
          cp -a apps/public-site/dist release-bundle/public-site/
          cp -a apps/admin-supabase/dist release-bundle/admin-supabase/
          tar -czf gsa-hub-release.tgz -C release-bundle public-site admin-supabase
      - name: Deploy bundle and backup previous release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          scp -i ~/.ssh/vps_key gsa-hub-release.tgz "$VPS_USER@$VPS_HOST:/tmp/gsa-hub-release-${GITHUB_SHA}.tgz"
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" "cd /var/www/gsa-hub/source && GIT_SSH_COMMAND='ssh -i ~/.ssh/gsa_hub_github -o IdentitiesOnly=yes' git pull --ff-only origin main && bash infra/deploy-release.sh /tmp/gsa-hub-release-${GITHUB_SHA}.tgz && rm -f /tmp/gsa-hub-release-${GITHUB_SHA}.tgz"