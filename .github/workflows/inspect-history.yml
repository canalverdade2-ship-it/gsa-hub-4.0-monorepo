name: Inspect historical migration sources
on:
  push:
    paths: [.github/workflows/inspect-history.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Locate historical SQL
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" 'sudo env PGPASSFILE=/etc/gsa-backup/pgpass pg_dump -h 127.0.0.1 -p 5433 -U supabase_admin -d gsahub --schema-only --schema=public --no-owner --no-acl' > schema.sql
      - uses: actions/upload-artifact@v4
        with:
          name: schema-only
          path: schema.sql
          retention-days: 1
