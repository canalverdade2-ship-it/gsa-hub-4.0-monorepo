name: Inspect historical migration sources
on:
  push:
    paths: [.github/workflows/inspect-history.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Locate historical SQL
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/vps_key "$VPS_USER@$VPS_HOST" 'sudo env PGPASSFILE=/etc/gsa-backup/pgpass psql -h 127.0.0.1 -p 5433 -U supabase_admin -d gsahub -Atc "SELECT count(*), min(version), max(version) FROM supabase_migrations.schema_migrations; SELECT version,name FROM supabase_migrations.schema_migrations ORDER BY version DESC LIMIT 15;"'
