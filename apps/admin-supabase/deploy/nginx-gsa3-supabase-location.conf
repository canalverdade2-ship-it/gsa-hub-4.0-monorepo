# Adicione este bloco ao servidor HTTPS existente. Publique dist/ em
# /var/www/gsa-hub-supabase/gsa3-supabase/ antes de recarregar o Nginx.
location = /gsa3-supabase {
    return 301 /gsa3-supabase/;
}

location ^~ /gsa3-supabase/ {
    root /var/www/gsa-hub-supabase;
    try_files $uri $uri/ /gsa3-supabase/index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
