  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        // Registra Service Worker apenas em ambiente de produção
        if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).then(registration => {
              registration.update().catch(() => {});
              console.log('ServiceWorker registration successful');
            }).catch(err => {
              console.log('ServiceWorker registration failed: ', err);
            });
          });
        } else {
          // Em desenvolvimento local (localhost), desregistra para evitar bloqueio do Vite / HMR
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (const registration of registrations) {
              registration.unregister();
            }
          });
        }
      }
      let refreshingForWorkerUpdate = false;
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshingForWorkerUpdate) return;
          refreshingForWorkerUpdate = true;
          window.location.reload();
        });
      }
    </script>
  </body>
